# Описание: запуск теста на гитхабе с помощью GitHub Actions
# тест запускается при каждом пуше или пулл запросе для ветки main/master
name: Playwright Tests # название
on:
  push: # запрос
    branches: [ main, master ] # ветка
  pull_request: # запрос
    branches: [ main, master ]
jobs: # задача
  test: # тест
    runs-on: ubuntu-latest # запуск на ubuntu-latest
    steps: # шаги
    - uses: actions/checkout@v6 # использовать actions/checkout@v6
    - name: Set up Python # название шага
      uses: actions/setup-python@v6 # использовать actions/setup-python@v6
      with: 
        python-version: '3.13' # с какой версией питона
    - name: Install dependencies
      run: # запуск|
        python -m pip install --upgrade pip
        pip install -r requirements.txt 
    - name: Ensure browsers are installed
      run: python -m playwright install --with-deps # установка plawright
    - name: Run your tests 
      run: pytest --tracing=retain-on-failure # запуск теста с трасингом 
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-traces 
        path: test-results/ # сохранение тресера
